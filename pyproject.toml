[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-misconfig-scanner"
version = "0.1.0"
description = "Read-only scanner for AWS security misconfigurations, mapped to CIS AWS Foundations and Security Hub controls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harsh Raj", email = "harshrajdebug@gmail.com" }]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
test = ["pytest>=8", "moto[s3,iam,ec2,cloudtrail,kms,rds,sts]>=5"]

[project.scripts]
misconfig = "misconfig.cli:main"

[tool.setuptools.packages.find]
include = ["misconfig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
